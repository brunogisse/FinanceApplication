<div class="aplicacao">

  <aside class="menu">
    <div class="marca">
      <span class="marca-icone" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="16" rx="2" />
          <path d="M3 10h18M8 3v4M16 3v4" />
        </svg>
      </span>
      <span class="marca-texto">
        <strong>Agenda Financeira</strong>
        <small>Contas a pagar</small>
      </span>
    </div>

    <nav class="itens">
      <a routerLink="/painel" routerLinkActive="ativo">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="7" height="9" rx="1" />
          <rect x="14" y="3" width="7" height="5" rx="1" />
          <rect x="14" y="12" width="7" height="9" rx="1" />
          <rect x="3" y="16" width="7" height="5" rx="1" />
        </svg>
        Painel
      </a>

      <a routerLink="/lancamentos" routerLinkActive="ativo">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 4h16v16H4z" />
          <path d="M8 9h8M8 13h8M8 17h5" />
        </svg>
        Lançamentos
      </a>

      <a routerLink="/relatorios/por-despesa" routerLinkActive="ativo">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 20V10M10 20V4M16 20v-7M22 20H2" />
        </svg>
        Consolidado
      </a>

      <a routerLink="/cadastros" routerLinkActive="ativo">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.6 7.4 12 3 3.4 7.4v9.2L12 21l8.6-4.4z" />
          <path d="M12 12v9M3.4 7.4 12 12l8.6-4.6" />
        </svg>
        Cadastros
      </a>

      @if (podeCadastrarUsuarios()) {
        <a routerLink="/usuarios" routerLinkActive="ativo">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>
          Usuários
        </a>
      }

      @if (podeImportar()) {
        <a routerLink="/importar" routerLinkActive="ativo">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3v12M8 11l4 4 4-4" />
            <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" />
          </svg>
          Importar planilha
        </a>
      }
    </nav>

    <div class="rodape-menu">
      <div class="quem">
        <span class="quem-inicial" aria-hidden="true">{{ (usuario() || '?').charAt(0) }}</span>
        <span class="quem-texto">
          <strong>{{ usuario() }}</strong>
          <small>{{ nivel() }}</small>
        </span>
      </div>
      @if (recado()) {
        <p class="recado">{{ recado() }}</p>
      }

      <!-- Única ação que todo nível pode fazer sobre si mesmo, inclusive quem só consulta e
           nunca vê a tela de usuários. Por isso mora aqui, e não lá. -->
      <button class="botao trocar-senha" (click)="trocarMinhaSenha()">Trocar minha senha</button>
      <button class="botao sair" (click)="sair()">Sair</button>
    </div>
  </aside>

  <main class="conteudo">
    <router-outlet />
  </main>
</div>
